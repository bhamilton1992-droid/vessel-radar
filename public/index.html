<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Vessel Radar</title>
  
  <!-- Official Leaflet CDN (Styles first, then Script) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

 <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #map {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Floating Status Bar */
    .status-bar {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 8px 16px;
      color: #f1f5f9;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      pointer-events: auto;
    }
    .status-dot { width: 9px; height: 9px; border-radius: 50%; background: #eab308; }
    .status-dot.online { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
    .status-dot.offline { background: #ef4444; }

    /* Floating Vessel Drawer / Modal */
    .vessel-drawer {
      position: absolute;
      bottom: 24px;
      left: 16px;
      right: 16px;
      max-width: 440px;
      margin: 0 auto;
      z-index: 1001;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 16px;
      border-radius: 16px;
      color: #f8fafc;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      transform: translateY(150%);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease;
    }
    
    /* When active, slide up and allow interactions */
    .vessel-drawer.open {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
      margin-bottom: 10px;
    }
    .drawer-title { font-size: 16px; font-weight: 600; color: #38bdf8; }
    .drawer-close {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #cbd5e1;
      font-size: 14px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .drawer-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      font-size: 13px;
    }
    .stat-label { color: #94a3b8; font-size: 11px; text-transform: uppercase; font-weight: 600; }
    .stat-val { font-weight: 500; color: #f1f5f9; margin-top: 2px; }
  </style>

  <body>

  <!-- 1. The status bar -->
  <div class="status-bar">
    <div id="statusDot" class="status-dot"></div>
    <span id="statusText">Connecting...</span>
    <span style="color:#64748b;">|</span>
    <span id="vesselCount">0 ships</span>
  </div>

  <!-- 2. THE MAP DIV MUST BE HERE (ABOVE THE SCRIPT TAG) -->
  <div id="map"></div>

  <!-- 3. The drawer -->
  <div id="drawer" class="vessel-drawer">
    <div class="drawer-header">
      <div id="shipName" class="drawer-title">Vessel Details</div>
      <button class="drawer-close" onclick="closeDrawer()">✕</button>
    </div>
    <div class="drawer-grid">
      <div><div class="stat-label">MMSI</div><div id="shipMmsi" class="stat-val">-</div></div>
      <div><div class="stat-label">Speed / Course</div><div id="shipSpeed" class="stat-val">-</div></div>
      <div><div class="stat-label">Type</div><div id="shipType" class="stat-val">-</div></div>
      <div><div class="stat-label">Heading</div><div id="shipHeading" class="stat-val">-</div></div>
    </div>
  </div>

  <script>
   // 1. Base Map Layers
      const osmLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19
      });

      const satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Esri Satellite',
        maxZoom: 19
      });

      // 2. OpenSeaMap for coastal/lake dayboards & lights
      const openSeaMarks = L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png', {
        attribution: 'OpenSeaMap',
        maxZoom: 18
      });

      // 3. Vector Layer for River Navigation Features
      const riverAidsLayer = L.layerGroup();

      // Initialize Map (Centered on Florence / Muscle Shoals / Wilson Lake)
      const map = L.map('map', {
        center: [34.80, -87.67],
        zoom: 13,
        layers: [osmLayer, riverAidsLayer, openSeaMarks]
      });

      setTimeout(() => { map.invalidateSize(); }, 250);

      L.control.layers(
        { "Streets": osmLayer, "Satellite": satLayer },
        { 
          "River Mile Markers & Locks": riverAidsLayer,
          "Nav Lights & Buoys": openSeaMarks
        },
        { position: 'topright' }
      ).addTo(map);

      // Fetch River Mile Markers, Locks, Dams, and Marinas dynamically
      function loadRiverNavFeatures() {
        // Only load when zoomed in enough to prevent huge network payloads
        if (map.getZoom() < 11) {
          riverAidsLayer.clearLayers();
          return;
        }

        const b = map.getBounds();
        const bbox = `${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()}`;
        
        const query = `[out:json][timeout:10];
          (
            node["waterway"="milestone"](${bbox});
            node["seamark:type"="distance_mark"](${bbox});
            node["waterway"="lock_gate"](${bbox});
            node["waterway"="dam"](${bbox});
            node["leisure"="marina"](${bbox});
          );
          out body;`;

        fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`)
          .then(res => res.json())
          .then(data => {
            riverAidsLayer.clearLayers();
            if (!data.elements) return;

            data.elements.forEach(el => {
              const tags = el.tags || {};
              let iconHtml = '';
              let label = '';

              // River Mile Markers (e.g. Mile 256)
              if (tags.waterway === 'milestone' || tags['seamark:type'] === 'distance_mark' || tags.distance) {
                const mile = tags.distance || tags.ref || tags.name || '';
                iconHtml = `<div style="
                  background: #0284c7;
                  color: #ffffff;
                  border: 1.5px solid #ffffff;
                  border-radius: 4px;
                  padding: 1px 4px;
                  font-size: 10px;
                  font-weight: 700;
                  white-space: nowrap;
                  box-shadow: 0 2px 6px rgba(0,0,0,0.5);
                  transform: translate(-50%, -50%);
                ">M ${mile}</div>`;
                label = `River Mile ${mile}`;
              }
              // Locks & Dams
              else if (tags.waterway === 'lock_gate' || tags.waterway === 'dam') {
                const isDam = tags.waterway === 'dam';
                iconHtml = `<div style="
                  background: #dc2626;
                  color: #fff;
                  border: 2px solid #fff;
                  border-radius: 50%;
                  width: 22px;
                  height: 22px;
                  font-size: 12px;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  box-shadow: 0 2px 6px rgba(0,0,0,0.5);
                  transform: translate(-50%, -50%);
                ">${isDam ? '🧱' : '⚓'}</div>`;
                label = tags.name || (isDam ? 'Dam' : 'Lock Chamber');
              }
              // Marinas & Docks
              else if (tags.leisure === 'marina') {
                iconHtml = `<div style="
                  background: #16a34a;
                  color: #fff;
                  border: 2px solid #fff;
                  border-radius: 50%;
                  width: 20px;
                  height: 20px;
                  font-size: 11px;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  box-shadow: 0 2px 6px rgba(0,0,0,0.5);
                  transform: translate(-50%, -50%);
                ">⛵</div>`;
                label = tags.name || 'Marina';
              }

              if (iconHtml) {
                const customIcon = L.divIcon({
                  className: 'river-feature-badge',
                  html: iconHtml,
                  iconSize: [0, 0]
                });

                L.marker([el.lat, el.lon], { icon: customIcon })
                  .bindPopup(`<strong>${label}</strong>`)
                  .addTo(riverAidsLayer);
              }
            });
          })
          .catch(err => console.warn("River aids fetch note:", err.message));
      }

      // Initial load & update on pan/zoom
      loadRiverNavFeatures();

      let navDebounce = null;
      map.on('moveend', () => {
        clearTimeout(navDebounce);
        navDebounce = setTimeout(loadRiverNavFeatures, 600);
      });
  </script>
</body>
</html>
