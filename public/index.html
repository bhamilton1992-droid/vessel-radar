<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Vessel Radar</title>
  
  <!-- Official Leaflet CDN (Styles first, then Script) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

 <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #map {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Floating Status Bar */
    .status-bar {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 8px 16px;
      color: #f1f5f9;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      pointer-events: auto;
    }
    .status-dot { width: 9px; height: 9px; border-radius: 50%; background: #eab308; }
    .status-dot.online { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
    .status-dot.offline { background: #ef4444; }

    /* Floating Vessel Drawer / Modal */
    .vessel-drawer {
      position: absolute;
      bottom: 24px;
      left: 16px;
      right: 16px;
      max-width: 440px;
      margin: 0 auto;
      z-index: 1001;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 16px;
      border-radius: 16px;
      color: #f8fafc;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      transform: translateY(150%);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease;
    }
    
    /* When active, slide up and allow interactions */
    .vessel-drawer.open {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
      margin-bottom: 10px;
    }
    .drawer-title { font-size: 16px; font-weight: 600; color: #38bdf8; }
    .drawer-close {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #cbd5e1;
      font-size: 14px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .drawer-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      font-size: 13px;
    }
    .stat-label { color: #94a3b8; font-size: 11px; text-transform: uppercase; font-weight: 600; }
    .stat-val { font-weight: 500; color: #f1f5f9; margin-top: 2px; }
  </style>

  <body>

  <!-- 1. The status bar -->
  <div class="status-bar">
    <div id="statusDot" class="status-dot"></div>
    <span id="statusText">Connecting...</span>
    <span style="color:#64748b;">|</span>
    <span id="vesselCount">0 ships</span>
  </div>

  <!-- 2. THE MAP DIV MUST BE HERE (ABOVE THE SCRIPT TAG) -->
  <div id="map"></div>

  <!-- 3. The drawer -->
  <div id="drawer" class="vessel-drawer">
    <div class="drawer-header">
      <div id="shipName" class="drawer-title">Vessel Details</div>
      <button class="drawer-close" onclick="closeDrawer()">✕</button>
    </div>
    <div class="drawer-grid">
      <div><div class="stat-label">MMSI</div><div id="shipMmsi" class="stat-val">-</div></div>
      <div><div class="stat-label">Speed / Course</div><div id="shipSpeed" class="stat-val">-</div></div>
      <div><div class="stat-label">Type</div><div id="shipType" class="stat-val">-</div></div>
      <div><div class="stat-label">Heading</div><div id="shipHeading" class="stat-val">-</div></div>
    </div>
  </div>

  <script>
    // 1. Base Map Layers
    const osmLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19
    });

    const satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Esri Satellite',
      maxZoom: 19
    });

    // 2. Navigational Overlays (Using native WMS & tile layers - no external plugins)
    const openSeaMarks = L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png', {
      attribution: 'OpenSeaMap',
      maxZoom: 18
    });

   const noaaCharts = L.tileLayer.wms('https://gis.charttools.noaa.gov/arcgis/rest/services/MCS/ENCOverlay/MapServer/exts/MaritimeChartService/WMSServer', {
        layers: '0',
        format: 'image/png',
        transparent: true,
        version: '1.3.0',
        opacity: 0.85,
        attribution: 'NOAA Charts'
      });

    // 3. Initialize Map
    const map = L.map('map', {
      center: [34.80, -87.67],
      zoom: 12,
      layers: [osmLayer, openSeaMarks]
    });

    setTimeout(() => { map.invalidateSize(); }, 200);

    L.control.layers(
      { "Streets": osmLayer, "Satellite": satLayer },
      { "River Nav Aids": openSeaMarks, "NOAA Nautical Charts": noaaCharts },
      { position: 'topright' }
    ).addTo(map);

    // 4. State & Helpers
    const vessels = new Map();
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const vesselCount = document.getElementById('vesselCount');

    function createShipSvg(heading) {
      const rot = heading || 0;
      return L.divIcon({
        className: 'ship-wrapper',
        html: `<svg style="transform: rotate(${rot}deg); display:block;" width="24" height="24" viewBox="0 0 24 24">
                 <path d="M12 2 L19 21 L12 17 L5 21 Z" fill="#0284c7" stroke="#ffffff" stroke-width="1.5"/>
               </svg>`,
        iconSize: [24, 24],
        iconAnchor: [12, 12]
      });
    }

    function openDrawer(v) {
      document.getElementById('shipName').innerText = v.name || ('Vessel ' + v.mmsi);
      document.getElementById('shipMmsi').innerText = v.mmsi;
      document.getElementById('shipSpeed').innerText = (v.sog || 0).toFixed(1) + ' kts / ' + Math.round(v.cog || 0) + '°';
      document.getElementById('shipType').innerText = v.type || "Commercial / Tow";
      document.getElementById('shipHeading').innerText = (v.heading || 0) + '°';
      document.getElementById('drawer').classList.add('open');
    }

    function closeDrawer() {
      document.getElementById('drawer').classList.remove('open');
    }
    function renderOrUpdateShip(shipData) {
      const mmsi = shipData.mmsi;
      const lat = shipData.lat;
      const lon = shipData.lon;
      const heading = shipData.heading || 0;

      let existing = vessels.get(mmsi);
      if (!existing) {
        const marker = L.marker([lat, lon], { icon: createShipSvg(heading) }).addTo(map);
        const record = Object.assign({}, shipData, { marker: marker });
        marker.on('click', () => openDrawer(record));
        vessels.set(mmsi, record);
      } else {
        existing.lat = lat;
        existing.lon = lon;
        existing.heading = heading;
        existing.sog = shipData.sog;
        if (shipData.name) existing.name = shipData.name;
        existing.marker.setLatLng([lat, lon]);
        existing.marker.setIcon(createShipSvg(heading));
      }
      vesselCount.innerText = vessels.size + ' ships';
    }

    // 5. WebSocket Connection
    const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(wsProtocol + '//' + window.location.host);

    function sendViewportBounds() {
      if (ws.readyState !== WebSocket.OPEN) return;
      const b = map.getBounds();
      const box = [
        [b.getNorth(), b.getWest()],
        [b.getSouth(), b.getEast()]
      ];
      ws.send(JSON.stringify({ type: 'SET_BOUNDS', box: box }));
    }

    let moveTimeout = null;
    map.on('moveend', () => {
      clearTimeout(moveTimeout);
      moveTimeout = setTimeout(sendViewportBounds, 800);
    });

    ws.onopen = () => {
      statusDot.className = 'status-dot online';
      statusText.innerText = 'Live Feed';
      sendViewportBounds();
    };

    ws.onclose = () => {
      statusDot.className = 'status-dot offline';
      statusText.innerText = 'Offline';
    };

    ws.onmessage = (event) => {
      try {
        const msg = JSON.parse(event.data);

        if (msg.type === 'SNAPSHOT' && Array.isArray(msg.vessels)) {
          msg.vessels.forEach(ship => renderOrUpdateShip(ship));
          return;
        }

        const type = msg.MessageType;
        const meta = msg.MetaData;

        if (type === "PositionReport" || type === "StandardClassBPositionReport") {
          const report = msg.Message && msg.Message[type];
          if (!report) return;

          const lat = meta && (meta.Latitude !== undefined ? meta.Latitude : meta.latitude);
          const lon = meta && (meta.Longitude !== undefined ? meta.Longitude : meta.longitude);
          if (lat === undefined || lon === undefined) return;

          const heading = (report.TrueHeading === 511 || report.TrueHeading === undefined)
            ? (report.Cog || 0)
            : report.TrueHeading;

          renderOrUpdateShip({
            mmsi: meta.MMSI,
            lat: lat,
            lon: lon,
            heading: heading,
            sog: report.Sog || 0,
            cog: report.Cog || 0,
            name: meta.ShipName ? meta.ShipName.trim() : ('MMSI ' + meta.MMSI)
          });
        }
      } catch (e) {
        console.error("Parse error:", e);
      }
    };
  </script>
</body>
</html>
