<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Vessel Radar</title>
  
  <!-- Reliable Leaflet CDN links -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <!-- ArcGIS Dynamic Map Support -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/esri-leaflet/3.0.12/esri-leaflet.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: #1e293b; /* slate background instead of pure black */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #map {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1;
    }

    /* Floating Status Bar */
    .status-bar {
      position: absolute; top: 14px; left: 14px; z-index: 1000;
      background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px; padding: 8px 16px;
      color: #f1f5f9; font-size: 13px; font-weight: 600;
      display: flex; align-items: center; gap: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    .status-dot { width: 9px; height: 9px; border-radius: 50%; background: #eab308; }
    .status-dot.online { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
    .status-dot.offline { background: #ef4444; }

    /* Vessel Drawer */
    .vessel-drawer {
      position: absolute; bottom: -300px; left: 0; right: 0; z-index: 1001;
      background: #0f172a; border-top: 1px solid #334155;
      padding: 16px; border-radius: 16px 16px 0 0;
      transition: bottom 0.25s ease; color: #f8fafc;
      box-shadow: 0 -4px 25px rgba(0,0,0,0.6);
      max-width: 500px; margin: 0 auto;
    }
    .vessel-drawer.open { bottom: 0; }
    .drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .drawer-title { font-size: 16px; font-weight: 600; color: #38bdf8; }
    .drawer-close { background: none; border: none; color: #94a3b8; font-size: 20px; cursor: pointer; }
    .drawer-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; font-size: 13px; margin-top: 8px; }
    .stat-label { color: #94a3b8; font-size: 11px; text-transform: uppercase; }
    .stat-val { font-weight: 500; color: #f1f5f9; }
  </style>
</head>
<body>

  <div class="status-bar">
    <div id="statusDot" class="status-dot"></div>
    <span id="statusText">Connecting...</span>
    <span style="color:#64748b;">|</span>
    <span id="vesselCount">0 ships</span>
  </div>

  <div id="map"></div>

  <div id="drawer" class="vessel-drawer">
    <div class="drawer-header">
      <div id="shipName" class="drawer-title">Vessel Details</div>
      <button class="drawer-close" onclick="closeDrawer()">✕</button>
    </div>
    <div class="drawer-grid">
      <div><div class="stat-label">MMSI</div><div id="shipMmsi" class="stat-val">-</div></div>
      <div><div class="stat-label">Speed / Course</div><div id="shipSpeed" class="stat-val">-</div></div>
      <div><div class="stat-label">Type</div><div id="shipType" class="stat-val">-</div></div>
      <div><div class="stat-label">Heading</div><div id="shipHeading" class="stat-val">-</div></div>
    </div>
  </div>

  <script>
    // 1. Base Map Setup
    const osmLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19
    });

    const satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Esri Satellite',
      maxZoom: 19
    });

    // 1. NOAA Official Navigational Charts (WMS - Standard image requests, no CORS blocks)
    // Provides depth soundings, buoys, lights, daybeacons, dredged channels, and hazards
    const noaaCharts = L.tileLayer.wms('https://gis.chartmaker.ncd.noaa.gov/arcgis/rest/services/MCS/ENCOverlay/MapServer/exts/MaritimeChartService/WMSServer', {
      layers: '0',
      format: 'image/png',
      transparent: true,
      version: '1.3.0',
      opacity: 0.85,
      attribution: 'NOAA Office of Coast Survey'
    });

    // 2. OpenSeaMap Seamarks (Buoys, beacons, port signals, lock gates)
    const openSeaMarks = L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: 'OpenSeaMap'
    });

    // 3. OpenRailway & Infrastructure Layer (Shows rail drawbridges, locks, & crossing structures)
    const riverInfrastructure = L.tileLayer('https://{s}.tiles.openrailwaymap.org/standard/{z}/{x}/{y}.png', {
      maxZoom: 19,
      opacity: 0.7,
      attribution: 'OpenRailwayMap'
    });

    const map = L.map('map', {
      center: [34.80, -87.67], // Centered on Pickwick/Wilson waterway
      zoom: 12,
      layers: [osmLayer, seaMarks]
    });

    // Force map recalculation to prevent black/blank rendering
    setTimeout(() => { map.invalidateSize(); }, 200);

   L.control.layers(
      { 
        "Streets": osmLayer, 
        "Satellite": satLayer 
      },
      { 
        "NOAA Nautical Charts": noaaCharts,
        "River Aids & Seamarks": openSeaMarks,
        "Bridges & Locks Infrastructure": riverInfrastructure
      },
      { position: 'topright', collapsed: true }
    ).addTo(map);

    // Turn both on by default so they display immediately
    noaaCharts.addTo(map);
    openSeaMarks.addTo(map);
    
    // 2. State & UI Helpers
    const vessels = new Map();
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const vesselCount = document.getElementById('vesselCount');

    function createShipSvg(heading) {
      const rot = heading || 0;
      return L.divIcon({
        className: 'ship-wrapper',
        html: `<svg style="transform: rotate(${rot}deg); display:block;" width="24" height="24" viewBox="0 0 24 24">
                 <path d="M12 2 L19 21 L12 17 L5 21 Z" fill="#0284c7" stroke="#ffffff" stroke-width="1.5"/>
               </svg>`,
        iconSize: [24, 24],
        iconAnchor: [12, 12]
      });
    }

    function openDrawer(v) {
      document.getElementById('shipName').innerText = v.name || ('Vessel ' + v.mmsi);
      document.getElementById('shipMmsi').innerText = v.mmsi;
      document.getElementById('shipSpeed').innerText = (v.sog || 0).toFixed(1) + ' kts / ' + Math.round(v.cog || 0) + '°';
      document.getElementById('shipType').innerText = v.type || "Commercial / Tow";
      document.getElementById('shipHeading').innerText = (v.heading || 0) + '°';
      document.getElementById('drawer').classList.add('open');
    }

    function closeDrawer() {
      document.getElementById('drawer').classList.remove('open');
    }

    function renderOrUpdateShip(shipData) {
      const mmsi = shipData.mmsi;
      const lat = shipData.lat;
      const lon = shipData.lon;
      const heading = shipData.heading || 0;

      let existing = vessels.get(mmsi);
      if (!existing) {
        const marker = L.marker([lat, lon], { icon: createShipSvg(heading) }).addTo(map);
        const record = Object.assign({}, shipData, { marker: marker });
        marker.on('click', () => openDrawer(record));
        vessels.set(mmsi, record);
      } else {
        existing.lat = lat;
        existing.lon = lon;
        existing.heading = heading;
        existing.sog = shipData.sog;
        if (shipData.name) existing.name = shipData.name;
        existing.marker.setLatLng([lat, lon]);
        existing.marker.setIcon(createShipSvg(heading));
      }
      vesselCount.innerText = vessels.size + ' ships';
    }

    // 3. WebSocket Connection
    const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(wsProtocol + '//' + window.location.host);

    function sendViewportBounds() {
      if (ws.readyState !== WebSocket.OPEN) return;
      const b = map.getBounds();
      const box = [
        [b.getNorth(), b.getWest()],
        [b.getSouth(), b.getEast()]
      ];
      ws.send(JSON.stringify({ type: 'SET_BOUNDS', box: box }));
    }

    let moveTimeout = null;
    map.on('moveend', () => {
      clearTimeout(moveTimeout);
      moveTimeout = setTimeout(sendViewportBounds, 800);
    });

    ws.onopen = () => {
      statusDot.className = 'status-dot online';
      statusText.innerText = 'Live Feed';
      sendViewportBounds();
    };

    ws.onclose = () => {
      statusDot.className = 'status-dot offline';
      statusText.innerText = 'Offline';
    };

    ws.onmessage = (event) => {
      try {
        const msg = JSON.parse(event.data);

        // Snapshot dump from server
        if (msg.type === 'SNAPSHOT' && Array.isArray(msg.vessels)) {
          msg.vessels.forEach(ship => renderOrUpdateShip(ship));
          return;
        }

        // Live AIS messages
        const type = msg.MessageType;
        const meta = msg.MetaData;

        if (type === "PositionReport" || type === "StandardClassBPositionReport") {
          const report = msg.Message && msg.Message[type];
          if (!report) return;

          const lat = meta && (meta.Latitude !== undefined ? meta.Latitude : meta.latitude);
          const lon = meta && (meta.Longitude !== undefined ? meta.Longitude : meta.longitude);
          if (lat === undefined || lon === undefined) return;

          const heading = (report.TrueHeading === 511 || report.TrueHeading === undefined)
            ? (report.Cog || 0)
            : report.TrueHeading;

          renderOrUpdateShip({
            mmsi: meta.MMSI,
            lat: lat,
            lon: lon,
            heading: heading,
            sog: report.Sog || 0,
            cog: report.Cog || 0,
            name: meta.ShipName ? meta.ShipName.trim() : ('MMSI ' + meta.MMSI)
          });
        }
      } catch (e) {
        console.error("Parse error:", e);
      }
    };
  </script>
</body>
</html>
