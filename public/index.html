<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Vessel Radar</title>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #map {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1;
    }

    .status-bar {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 8px 16px;
      color: #f1f5f9;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }
    .status-dot { width: 9px; height: 9px; border-radius: 50%; background: #eab308; }
    .status-dot.online { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
    .status-dot.offline { background: #ef4444; }

    .vessel-drawer {
      position: absolute;
      bottom: 24px;
      left: 16px;
      right: 16px;
      max-width: 440px;
      margin: 0 auto;
      z-index: 1001;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 16px;
      border-radius: 16px;
      color: #f8fafc;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      transform: translateY(180%);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.25s ease, opacity 0.2s ease;
    }
    .vessel-drawer.open {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 8px;
      margin-bottom: 8px;
    }
    .drawer-title { font-size: 16px; font-weight: 600; color: #38bdf8; }
    .drawer-close {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #cbd5e1;
      font-size: 14px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .drawer-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      font-size: 13px;
    }
    .stat-label { color: #94a3b8; font-size: 11px; text-transform: uppercase; font-weight: 600; }
    .stat-val { font-weight: 500; color: #f1f5f9; margin-top: 2px; }
  </style>
</head>
<body>

  <div class="status-bar">
    <div id="statusDot" class="status-dot"></div>
    <span id="statusText">Connecting...</span>
    <span style="color:#64748b;">|</span>
    <span id="vesselCount">0 ships</span>
  </div>

  <div id="map"></div>

  <div id="drawer" class="vessel-drawer">
    <div class="drawer-header">
      <div id="shipName" class="drawer-title">Vessel Details</div>
      <button class="drawer-close" onclick="closeDrawer()">✕</button>
    </div>
    <div class="drawer-grid">
      <div><div class="stat-label">MMSI</div><div id="shipMmsi" class="stat-val">-</div></div>
      <div><div class="stat-label">Speed / Course</div><div id="shipSpeed" class="stat-val">-</div></div>
      <div><div class="stat-label">Type</div><div id="shipType" class="stat-val">-</div></div>
      <div><div class="stat-label">Heading</div><div id="shipHeading" class="stat-val">-</div></div>
    </div>
  </div>

  <script>
    window.addEventListener("load", () => {
      // 1. Base Tile Layers
      const osmLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap',
        maxZoom: 19
      });

      const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Esri Satellite',
        maxZoom: 19
      });

      // 2. Navigation Layer (OpenSeaMap: seamarks, beacons, navigation markers)
      const seamarks = L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png', {
        attribution: 'OpenSeaMap',
        maxZoom: 18
      });

      // 3. Mount Map
      const map = L.map('map', {
        center: [34.80, -87.67],
        zoom: 12,
        layers: [osmLayer, seamarks]
      });

      setTimeout(() => { map.invalidateSize(); }, 200);

      // Layer control
      L.control.layers(
        { "OpenStreetMap": osmLayer, "Satellite": satellite },
        { "Navigation Markers (OpenSeaMap)": seamarks },
        { position: 'topright' }
      ).addTo(map);

      // 4. State & UI Handlers
      const vessels = new Map();
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      const vesselCount = document.getElementById('vesselCount');

      function createShipSvg(heading) {
        const rot = heading || 0;
        return L.divIcon({
          className: 'ship-wrapper',
          html: `<svg style="transform: rotate(${rot}deg); display:block;" width="24" height="24" viewBox="0 0 24 24">
                   <path d="M12 2 L19 21 L12 17 L5 21 Z" fill="#0284c7" stroke="#ffffff" stroke-width="1.5"/>
                 </svg>`,
          iconSize: [24, 24],
          iconAnchor: [12, 12]
        });
      }

      window.openDrawer = function(v) {
        document.getElementById('shipName').innerText = v.name || ('Vessel ' + v.mmsi);
        document.getElementById('shipMmsi').innerText = v.mmsi;
        document.getElementById('shipSpeed').innerText = (v.sog || 0).toFixed(1) + ' kts / ' + Math.round(v.cog || 0) + '°';
        document.getElementById('shipType').innerText = v.type || "Commercial / Tow";
        document.getElementById('shipHeading').innerText = (v.heading || 0) + '°';
        document.getElementById('drawer').classList.add('open');
      };

      window.closeDrawer = function() {
        document.getElementById('drawer').classList.remove('open');
      };

      function updateShip(shipData) {
        const mmsi = shipData.mmsi;
        const lat = shipData.lat;
        const lon = shipData.lon;
        const heading = shipData.heading || 0;

        let ship = vessels.get(mmsi);
        if (!ship) {
          const marker = L.marker([lat, lon], { icon: createShipSvg(heading) }).addTo(map);
          const record = Object.assign({}, shipData, { marker });
          marker.on('click', () => window.openDrawer(record));
          vessels.set(mmsi, record);
        } else {
          ship.lat = lat;
          ship.lon = lon;
          ship.heading = heading;
          ship.sog = shipData.sog;
          if (shipData.name) ship.name = shipData.name;
          ship.marker.setLatLng([lat, lon]);
          ship.marker.setIcon(createShipSvg(heading));
        }
        vesselCount.innerText = `${vessels.size} ships`;
      }

      // 5. WebSocket Integration
      const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(wsProtocol + '//' + window.location.host);

      function sendBounds() {
        if (ws.readyState !== WebSocket.OPEN) return;
        const b = map.getBounds();
        ws.send(JSON.stringify({
          type: 'SET_BOUNDS',
          box: [
            [b.getNorth(), b.getWest()],
            [b.getSouth(), b.getEast()]
          ]
        }));
      }

      let moveDebounce = null;
      map.on('moveend', () => {
        clearTimeout(moveDebounce);
        moveDebounce = setTimeout(sendBounds, 750);
      });

      ws.onopen = () => {
        statusDot.className = 'status-dot online';
        statusText.innerText = 'Live Feed';
        sendBounds();
      };

      ws.onclose = () => {
        statusDot.className = 'status-dot offline';
        statusText.innerText = 'Offline';
      };

      ws.onerror = () => {
        statusDot.className = 'status-dot offline';
        statusText.innerText = 'Error';
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);

          if (msg.type === 'SNAPSHOT' && Array.isArray(msg.vessels)) {
            msg.vessels.forEach(updateShip);
            return;
          }

          const type = msg.MessageType;
          const meta = msg.MetaData;

          if (type === "PositionReport" || type === "StandardClassBPositionReport") {
            const report = msg.Message?.[type];
            if (!report) return;

            const lat = meta?.Latitude ?? meta?.latitude ?? report?.Latitude;
            const lon = meta?.Longitude ?? meta?.longitude ?? report?.Longitude;
            if (lat === undefined || lon === undefined) return;

            const heading = (report.TrueHeading === 511 || report.TrueHeading === undefined)
              ? (report.Cog || 0)
              : report.TrueHeading;

            updateShip({
              mmsi: meta.MMSI,
              lat: lat,
              lon: lon,
              heading: heading,
              sog: report.Sog || 0,
              cog: report.Cog || 0,
              name: meta.ShipName ? meta.ShipName.trim() : ('MMSI ' + meta.MMSI)
            });
          }
        } catch (err) {
          // Ignore invalid packets
        }
      };
    });
  </script>
</body>
</html>
